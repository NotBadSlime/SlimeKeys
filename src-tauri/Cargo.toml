[package]
name = "slimekeys"
version = "0.1.0"
description = "Translate MIDI notes into keyboard actions."
authors = ["NotBadSlime"]
edition = "2021"

[lib]
name = "slimekeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slimekeys"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
midir = "0.11.0"
midly = "0.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2.11.3"
thiserror = "2.0"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
